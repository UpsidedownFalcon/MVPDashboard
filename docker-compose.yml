# Stage-2 stack: redis + ingest + api + db (caddy still profiled off until
# S2-T08). All wiring comes from the root .env.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # no host port: internal only (see redis-debug below for local poking)

  # `docker compose --profile debug up -d` exposes redis on 127.0.0.1:6379
  # for redis-cli poking without ever opening it by default.
  redis-debug:
    image: alpine/socat
    profiles: ["debug"]
    command: TCP-LISTEN:6379,fork,reuseaddr TCP:redis:6379
    ports:
      - "127.0.0.1:6379:6379"
    depends_on:
      - redis

  ingest:
    build: ./backend
    command: python -m ingest.main
    env_file: .env
    ports:
      - "${UDP_PORT}:${UDP_PORT}/udp"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  api:
    build: ./backend
    # migrations run before uvicorn on every start (idempotent — S2-T01)
    command: sh -c "python -m migrations.migrate && exec uvicorn api.main:app --host 0.0.0.0 --port ${API_PORT}"
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen(f\"http://127.0.0.1:{os.environ['API_PORT']}/api/health/live\")"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # $$ so compose passes the vars through to the container shell
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # no host port: internal only (see db-debug below)

  # `docker compose --profile debug up -d` exposes postgres on 127.0.0.1:5432
  # for psql poking + host-side db tests without ever opening it by default.
  db-debug:
    image: alpine/socat
    profiles: ["debug"]
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:db:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      - db

  # --- stage 2 tail-end (inactive until S2-T08) --------------------------------

  caddy:
    image: caddy:2
    profiles: ["stage2"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
