[project]
name = "backend"
version = "0.1.0"
description = "MVP Dashboard backend: ingest + api services (shared package)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "redis>=5",
    "numpy",
    # scipy.signal.lfilter runs the biomech one-pole cascades in C and carries
    # filter state exactly across ticks (docs/biomech/SPEC.md §7.1). Must stay
    # declared here: the Dockerfile's second install uses --no-deps, so an
    # undeclared transitive dep would be silently absent at runtime.
    "scipy",
    "pydantic-settings",
    "orjson",
    # stage 2: TimescaleDB access (batched COPY writer, queries, migrations)
    "asyncpg",
    # stage 2: predict.fit()'s stable interface takes a DataFrame (schema §5)
    "pandas",
    # stage 3 auth (S3-T05): bcrypt used directly — passlib is unmaintained and
    # breaks against bcrypt >= 4.1; pyjwt for the HS256 session cookie
    "bcrypt",
    "pyjwt",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: common/, ingest/, api/ are top-level importable packages, matching
# the in-container layout (workdir = backend/, `python -m ingest.main`).
[tool.hatch.build.targets.wheel]
packages = ["common", "ingest", "api", "migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
